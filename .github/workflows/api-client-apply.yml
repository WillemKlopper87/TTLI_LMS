name: api-client-apply

on:
  pull_request:

permissions:
  actions: read
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/t12-popia-data-subject-rights'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: feat/t12-popia-data-subject-rights
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated-api-client
          path: packages/api-client/src
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '35096608862'

      - name: Verify and commit generated client
        run: |
          echo '236778732383b2495bbc964e4332705e70a1587629892590d58b67d117c229c1  packages/api-client/src/schema.gen.ts' | sha256sum -c -
          git add packages/api-client/src/schema.gen.ts
          if git diff --cached --quiet; then
            echo 'Generated client already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix(api-client): regenerate schema for privacy endpoints'
          git push origin HEAD:feat/t12-popia-data-subject-rights
