name: api-client-diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-client-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://app_user:app_user_ci@localhost:5452/ttli
      DATABASE_URL_SYNC: postgresql+psycopg2://ttli:ttli_ci@localhost:5452/ttli
      APP_DB_PASSWORD: app_user_ci
      REDIS_URL: redis://localhost:6399/0
      SECRET_KEY: ci-secret-key-at-least-thirty-two-characters
      FIELD_ENCRYPTION_KEY: RkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkY=
      BLIND_INDEX_KEY: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
      BREAK_GLASS_ADMIN_ENABLED: "true"
      BREAK_GLASS_ADMIN_PASSWORD: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -r requirements-dev.txt

      - name: Export OpenAPI
        working-directory: apps/api
        run: python -c "import json; from src.main import app; print(json.dumps(app.openapi(), indent=2))" > openapi.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/api-client/package-lock.json

      - name: Generate API client
        working-directory: packages/api-client
        run: |
          npm ci
          npx openapi-typescript ../../apps/api/openapi.json -o src/schema.gen.ts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-api-client
          path: packages/api-client/src/schema.gen.ts
          if-no-files-found: error
