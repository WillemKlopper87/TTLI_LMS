name: weekly-image-rescan

# Detects drift the push-triggered scan in ci.yml can't see: a CVE
# disclosed *after* today's build, against a digest-pinned base image
# that hasn't changed at all. apps/api/Dockerfile and apps/web/Dockerfile
# both say "re-resolve deliberately, not on a schedule" for *upgrading*
# the pin — that stays true here. This workflow only detects and reports;
# it never bumps a digest or opens a PR on its own. A human decides
# whether/how to respond, the same "report M7" pattern already visible
# in this repo's own history (a manual remediation pass after Trivy
# findings), just running on a timer instead of relying on someone
# thinking to check.
on:
  schedule:
    # 04:00 UTC every Monday — arbitrary but deliberately not "on every
    # push," since nothing about the code changed to justify that.
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  rescan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build images exactly as shipped (no cache — today's Trivy DB, current pinned digests)
        run: |
          docker build --no-cache -t ttli-api:rescan -f apps/api/Dockerfile apps/api
          docker build --no-cache -t ttli-web:rescan -f apps/web/Dockerfile .

      - name: Install Trivy
        run: |
          wget -qO - https://get.trivy.dev/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://get.trivy.dev/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      - name: Scan (report-only — see the job header for why)
        id: scan
        run: |
          set +e
          FAILED=0
          # Per-image scoping, matching ci.yml. The baseline strips the
          # four util-linux IDs; postgres gets the full file, and the two
          # Debian-based app images get them back on the reachability
          # evidence recorded in .trivyignore (non-root uid 10001, no
          # CAP_SYS_ADMIN). Anything added to this loop later starts from
          # the strict baseline and must argue its own case.
          base_ignore="$(mktemp)"
          app_ignore="$(mktemp)"
          trap 'rm -f "$base_ignore" "$app_ignore"' EXIT
          grep -Ev '^CVE-2026-(76642|78408|78409|78410) ' .trivyignore > "$base_ignore"
          { cat "$base_ignore"
            grep -E '^CVE-2026-(76642|78408|78409|78410) ' .trivyignore
          } > "$app_ignore"
          postgres_image="postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2"
          for spec in "ttli-api:rescan|ttli-api-rescan" "ttli-web:rescan|ttli-web-rescan" "$postgres_image|postgres-production"; do
            IFS='|' read -r img report_name <<< "$spec"
            ignorefile="$app_ignore"
            if [[ "$img" == "$postgres_image" ]]; then
              ignorefile="$GITHUB_WORKSPACE/.trivyignore"
            fi
            safe_name="trivy-${report_name}-report.txt"
            echo "::group::Trivy: $img"
            trivy image --severity CRITICAL,HIGH --ignorefile "$ignorefile" \
              --format table "$img" > "$safe_name"
            trivy image --severity CRITICAL,HIGH --exit-code 1 --ignorefile "$ignorefile" "$img"
            [ $? -ne 0 ] && FAILED=1
            echo "::endgroup::"
          done
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      # Uploaded regardless of outcome, not just on a new finding — the
      # evidence should exist even when nothing failed, and even if the
      # issue-filing step below itself has a problem.
      - name: Upload scan reports as an artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-weekly-reports
          path: trivy-*-report.txt
          if-no-files-found: warn

      - name: File or update an issue if anything new turned up
        if: steps.scan.outputs.failed == '1'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const apiReport = fs.existsSync('trivy-ttli-api-rescan-report.txt') ? fs.readFileSync('trivy-ttli-api-rescan-report.txt', 'utf8') : '(no api report file)';
            const webReport = fs.existsSync('trivy-ttli-web-rescan-report.txt') ? fs.readFileSync('trivy-ttli-web-rescan-report.txt', 'utf8') : '(no web report file)';
            const postgresReport = fs.existsSync('trivy-postgres-production-report.txt') ? fs.readFileSync('trivy-postgres-production-report.txt', 'utf8') : '(no PostgreSQL report file)';
            // A stable marker, not the dated title, is what identifies
            // "the same unresolved finding" across weekly runs — without
            // it, every Monday opens a new issue for a CVE nobody has
            // triaged yet instead of bumping the existing one.
            const marker = '<!-- weekly-image-scan-marker: do not remove -->';
            const body = [
              marker,
              'The weekly image re-scan found a CRITICAL/HIGH finding not covered by `.trivyignore`,',
              'against the *currently pinned* application or PostgreSQL images — nothing in this repo changed to cause this.',
              '',
              'This means a CVE was disclosed after the current digest pin was last resolved.',
              'Identify the affected pin in `apps/api/Dockerfile`, `apps/web/Dockerfile`, or',
              '`infra/docker-compose.single-vm.yml`; re-resolve it with',
              '`docker buildx imagetools inspect <image>:<tag>`, then decide: bump the pin, add a',
              '`.trivyignore` entry with a stated reason if it\'s a false positive/not exploitable here,',
              'or accept and track if there\'s no fix upstream yet.',
              '',
              '<details><summary>API image report</summary>\n\n```\n' + apiReport.slice(0, 6000) + '\n```\n</details>',
              '<details><summary>Web image report</summary>\n\n```\n' + webReport.slice(0, 6000) + '\n```\n</details>',
              '<details><summary>PostgreSQL image report</summary>\n\n```\n' + postgresReport.slice(0, 6000) + '\n```\n</details>',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependencies',
            });
            const open = existing.data.find((issue) => issue.body && issue.body.includes(marker));

            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `Still failing as of ${new Date().toISOString().slice(0, 10)}:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Weekly image scan: new CRITICAL/HIGH finding (${new Date().toISOString().slice(0,10)})`,
                body,
                labels: ['security', 'dependencies'],
              });
            }
