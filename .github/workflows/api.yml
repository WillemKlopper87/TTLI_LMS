name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: apps/api

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ttli
          POSTGRES_PASSWORD: ttli_ci
          POSTGRES_DB: ttli
        ports: ["5452:5432"]
        options: >-
          --health-cmd "pg_isready -U ttli -d ttli"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports: ["6399:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      # No health-cmd: the image ships no CLI to probe with, and unlike
      # MinIO it needs no launch args (docker inspect confirms CMD is just
      # [MailHog]) so it starts serving as soon as the container is up.
      mailhog:
        image: mailhog/mailhog:latest
        ports: ["1145:1025", "8145:8025"]

      # Also needs no launch args (same reasoning as mailhog above), so it
      # qualifies as a real CI service — unlike MinIO. --health-retries is
      # high because first boot downloads the virus database, which can
      # take a few minutes; GH Actions has no start_period option the way
      # docker-compose's healthcheck does, so the retry budget covers it
      # instead (15 × 30s = 7.5 min ceiling).
      clamav:
        image: clamav/clamav-debian:stable
        ports: ["3410:3310"]
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 15

    env:
      ENVIRONMENT: local
      # app_user, not ttli: ttli is the Postgres bootstrap superuser and
      # superusers bypass RLS unconditionally. Migrations still run as ttli
      # (DATABASE_URL_SYNC) — they need the superuser for DDL.
      DATABASE_URL: postgresql+asyncpg://app_user:app_user_ci@localhost:5452/ttli
      DATABASE_URL_SYNC: postgresql+psycopg2://ttli:ttli_ci@localhost:5452/ttli
      APP_DB_PASSWORD: app_user_ci
      REDIS_URL: redis://localhost:6399/0
      SECRET_KEY: ci-secret-key-at-least-thirty-two-characters
      FIELD_ENCRYPTION_KEY: RkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkY=
      BLIND_INDEX_KEY: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
      BREAK_GLASS_ADMIN_ENABLED: "true"
      BREAK_GLASS_ADMIN_PASSWORD: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      # tests/test_media.py runs a real transcode against real ffmpeg
      # (06 §3) — the same "don't mock it" reasoning as ClamAV below.
      # ubuntu-latest ships ffmpeg already, but this workflow's zero-skip
      # policy (the "Assert integration tests ran" step) turns a missing
      # binary into a hard CI failure rather than a quiet skip, so this is
      # asserted explicitly instead of assumed.
      - name: Verify ffmpeg is available
        run: ffmpeg -version && ffprobe -version

      # The extensions are created by postgres-init in Compose; the CI service
      # container does not mount it, so they are applied here instead.
      #
      # Explicit flags, not "$DATABASE_URL_SYNC" as a URI: psql does not
      # understand the postgresql+psycopg2:// scheme SQLAlchemy uses (that
      # +psycopg2 driver suffix is a SQLAlchemy convention, not part of libpq's
      # URI grammar) — it fails to parse, falls back to a local socket, and
      # dies with "No such file or directory". Never caught locally because
      # this workflow had not executed even once before this comment was
      # written; local verification always went through `docker exec
      # ttli-postgres psql` directly, bypassing this exact invocation.
      - name: Create extensions
        run: psql -h localhost -p 5452 -U ttli -d ttli -f ../../infra/postgres-init/01-extensions.sql
        env:
          PGPASSWORD: ttli_ci
        continue-on-error: false

      # Dependency scanning (04 §3, §10). --desc prints the advisory text so
      # a failure is actionable from the CI log alone. A real run of this
      # once found 35 CVEs across fastapi/starlette, PyJWT, cryptography
      # and python-multipart — all fixed by version bumps, not ignored;
      # see requirements.txt's comment and HANDOFF.md.
      - name: Dependency scan
        run: pip-audit -r requirements-dev.txt --desc

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Migrate
        run: alembic upgrade head

      - name: Test
        run: pytest --cov=src --cov-report=term-missing --junitxml=report.xml

      # A skipped integration test is a test that silently stopped protecting
      # anything. The RLS suite is the whole reason tenant isolation is
      # trustworthy, so a skip fails the build.
      - name: Assert integration tests ran
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("report.xml").getroot()
          skipped = int(suite.get("skipped") or suite[0].get("skipped") or 0)
          tests = int(suite.get("tests") or suite[0].get("tests") or 0)
          print(f"{tests} tests, {skipped} skipped")
          if skipped:
              sys.exit("integration tests were skipped — is the Postgres service healthy?")
          PY

      - name: Migration round-trip
        run: |
          alembic downgrade -1
          alembic upgrade head

      - name: No un-migrated model drift
        run: alembic check

      - name: Export OpenAPI
        run: |
          python -c "import json; from src.main import app; print(json.dumps(app.openapi(), indent=2))" > openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: apps/api/openapi.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/api-client/package-lock.json

      # The generated client is committed; a schema change that was not
      # regenerated and committed alongside it fails here. This is the drift
      # gate the type contract depends on (README "Type contract" row).
      - name: api-client drift
        working-directory: packages/api-client
        run: |
          npm ci
          npm run generate
          git diff --exit-code -- src/schema.gen.ts
          npm run typecheck

      # npm's own advisory database (04 §3, §10) — the js-yaml override in
      # package.json exists because of a finding this step would have caught;
      # keeping it here catches the next one instead of relying on memory.
      - name: Dependency scan (api-client)
        working-directory: packages/api-client
        run: npm audit --audit-level=high

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/api-client/package-lock.json

      # apps/web depends on @ttli/api-client via "file:../../packages/api-client"
      # — npm symlinks the package directory itself, but its own dependencies
      # (openapi-fetch) resolve from *its* node_modules, not apps/web's. That
      # only exists once this install runs.
      - name: Install api-client
        working-directory: packages/api-client
        run: npm ci

      - name: Install web
        run: npm ci

      - name: Dependency scan (web)
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      # --webpack (already in package.json's build script): Turbopack, Next
      # 16's default, cannot currently resolve @ttli/api-client through the
      # npm-workspace symlink above — a known, still-open upstream limitation
      # (vercel/next.js#85316, #88335, #77562). See apps/web/next.config.ts.
      - name: Build
        run: npm run build
