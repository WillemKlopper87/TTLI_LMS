name: branch-write-test
on:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/t12-popia-data-subject-rights
      - name: Verify branch push path
        run: git push --dry-run origin HEAD:feat/t12-popia-data-subject-rights
