name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The GITHUB_TOKEN needs nothing beyond reading the checkout; say so
# instead of inheriting whatever the repo default happens to be.
permissions:
  contents: read

# A rapid push series (the autosave era proved it happens) should cancel
# the runs it superseded rather than queue behind them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: apps/api

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        # PG18's PGDATA-path change (dependency-upgrade sprint E,
        # infra/docker-compose.yml has the detail) doesn't apply here —
        # GH Actions service containers use the image's own ephemeral
        # storage with no custom volume mount, so there's nothing for
        # the new versioned path to conflict with.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ttli
          POSTGRES_PASSWORD: ttli_ci
          POSTGRES_DB: ttli
        ports: ["5452:5432"]
        options: >-
          --health-cmd "pg_isready -U ttli -d ttli"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      redis:
        image: redis:8-alpine
        ports: ["6399:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      # Mailpit (infra/docker-compose.yml's docstring has the Trivy-scan
      # reasoning for why it's not mailhog/mailhog; the service is named for
      # what it actually runs) — no health-cmd, no
      # launch args, so it starts serving as soon as the container is up.
      mailpit:
        image: axllent/mailpit:v1.29.2
        ports: ["1145:1025", "8145:8025"]

      # No health-cmd: the image ships no CLI to probe with, and it needs
      # no launch args, so it qualifies as a real CI service — unlike
      # MinIO. --health-retries is high because first boot downloads the
      # virus database, which can take a few minutes; GH Actions has no
      # start_period option the way docker-compose's healthcheck does, so
      # the retry budget covers it instead (15 × 30s = 7.5 min ceiling).
      clamav:
        image: clamav/clamav-debian:stable
        ports: ["3410:3310"]
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 15

    env:
      ENVIRONMENT: local
      # app_user, not ttli: ttli is the Postgres bootstrap superuser and
      # superusers bypass RLS unconditionally. Migrations still run as ttli
      # (DATABASE_URL_SYNC) — they need the superuser for DDL.
      DATABASE_URL: postgresql+asyncpg://app_user:app_user_ci@localhost:5452/ttli
      DATABASE_URL_SYNC: postgresql+psycopg2://ttli:ttli_ci@localhost:5452/ttli
      APP_DB_PASSWORD: app_user_ci
      REDIS_URL: redis://localhost:6399/0
      SECRET_KEY: ci-secret-key-at-least-thirty-two-characters
      FIELD_ENCRYPTION_KEY: RkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkY=
      BLIND_INDEX_KEY: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
      BREAK_GLASS_ADMIN_ENABLED: "true"
      BREAK_GLASS_ADMIN_PASSWORD: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      # tests/test_media.py runs a real transcode against real ffmpeg
      # (06 §3) — the same "don't mock it" reasoning as ClamAV below.
      # ubuntu-latest does NOT ship ffmpeg (confirmed the hard way: a
      # first version of this step only *verified* ffmpeg was present and
      # failed with "command not found" — apt installs it instead now).
      # This workflow's zero-skip policy (the "Assert integration tests
      # ran" step) turns a missing binary into a hard CI failure rather
      # than a quiet skip, so this can't be silently wrong again.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify ffmpeg is available
        run: ffmpeg -version && ffprobe -version

      # The extensions are created by postgres-init in Compose; the CI service
      # container does not mount it, so they are applied here instead.
      #
      # Explicit flags, not "$DATABASE_URL_SYNC" as a URI: psql does not
      # understand the postgresql+psycopg2:// scheme SQLAlchemy uses (that
      # +psycopg2 driver suffix is a SQLAlchemy convention, not part of libpq's
      # URI grammar) — it fails to parse, falls back to a local socket, and
      # dies with "No such file or directory". Never caught locally because
      # this workflow had not executed even once before this comment was
      # written; local verification always went through `docker exec
      # ttli-postgres psql` directly, bypassing this exact invocation.
      - name: Create extensions
        run: psql -h localhost -p 5452 -U ttli -d ttli -f ../../infra/postgres-init/01-extensions.sql
        env:
          PGPASSWORD: ttli_ci
        continue-on-error: false

      # Dependency scanning (04 §3, §10). --desc prints the advisory text so
      # a failure is actionable from the CI log alone. A real run of this
      # once found 35 CVEs across fastapi/starlette, PyJWT, cryptography
      # and python-multipart — all fixed by version bumps, not ignored;
      # see requirements.txt's comment and HANDOFF.md.
      - name: Dependency scan
        run: pip-audit -r requirements-dev.txt --desc

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Migrate
        run: alembic upgrade head

      - name: Test
        run: pytest --cov=src --cov-report=term-missing --junitxml=report.xml

      # A skipped integration test is a test that silently stopped protecting
      # anything. The RLS suite is the whole reason tenant isolation is
      # trustworthy, so a skip fails the build.
      - name: Assert integration tests ran
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("report.xml").getroot()
          skipped = int(suite.get("skipped") or suite[0].get("skipped") or 0)
          tests = int(suite.get("tests") or suite[0].get("tests") or 0)
          print(f"{tests} tests, {skipped} skipped")
          if skipped:
              sys.exit("integration tests were skipped — is the Postgres service healthy?")
          PY

      - name: Migration round-trip
        run: |
          alembic downgrade -1
          alembic upgrade head

      - name: No un-migrated model drift
        run: alembic check

      - name: Export OpenAPI
        run: |
          python -c "import json; from src.main import app; print(json.dumps(app.openapi(), indent=2))" > openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: apps/api/openapi.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/api-client/package-lock.json

      # The generated client is committed; a schema change that was not
      # regenerated and committed alongside it fails here. This is the drift
      # gate the type contract depends on (README "Type contract" row).
      - name: api-client drift
        working-directory: packages/api-client
        run: |
          npm ci
          npm run generate
          git diff --exit-code -- src/schema.gen.ts
          npm run typecheck

      # npm's own advisory database (04 §3, §10) — the js-yaml override in
      # package.json exists because of a finding this step would have caught;
      # keeping it here catches the next one instead of relying on memory.
      - name: Dependency scan (api-client)
        working-directory: packages/api-client
        run: npm audit --audit-level=high

      # Both are cheap, deterministic, zero-service checks that README and
      # STATUS have always listed as manual verification steps — which
      # meant they ran only when someone remembered. Now they gate.
      - name: Docs link integrity
        working-directory: .
        run: python docs/check_links.py

      - name: Source extraction fidelity
        working-directory: .
        run: python docs/source/extract.py --check

      # Container image scan (04 §3, §10 — the same images independently
      # reviewed there). Installed via the official GPG-signed apt repo,
      # not the aquasecurity/trivy-action GitHub Action: that action had a
      # real supply-chain compromise in March 2026 (76 of 77 version tags
      # force-pushed to credential-stealing malware) — pinning a third-party
      # Action by a mutable tag would reintroduce exactly the kind of risk
      # this step exists to catch. `trivy image` doesn't fail on findings by
      # default (no `--exit-code` passed) — deliberately report-only, not a
      # gate: these are fixed upstream base images this project doesn't
      # control the code of, and at least one already-reviewed finding
      # (clamav-debian's bundled Debian packages, docs/STATUS.md §10) has no
      # upstream fix available at all, so failing the build on it would turn
      # every unrelated PR red for something engineering can't act on.
      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://get.trivy.dev/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://get.trivy.dev/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Container image scan (report-only)
        run: |
          for img in postgres:18-alpine redis:8-alpine dxflrs/garage:v2.3.0 axllent/mailpit:v1.29.2 clamav/clamav-debian:stable; do
            echo "::group::Trivy: $img"
            trivy image --severity CRITICAL,HIGH "$img"
            echo "::endgroup::"
          done

  # Secret scanning (04 §3, §10; BACKLOG.md O4). Dev credentials are
  # deliberately hardcoded in infra/docker-compose.yml, .env.example and
  # the `quality` job's own env block above — .gitleaks.toml allowlists
  # exactly those nine known values (verified individually, 2026-08-23,
  # against a full `gitleaks detect` run) so this gate stays green for
  # what's already reviewed and fails the day a *real* key lands instead
  # of being red from commit one. Installed the same way as Trivy above —
  # a checksum-verified release download, not gitleaks/gitleaks-action
  # pinned by a mutable tag.
  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans commit history, not just the working tree

      - name: Install gitleaks
        run: |
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --ignore-missing -c gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Secret scan (full history)
        working-directory: .
        run: gitleaks detect --source . --config .gitleaks.toml -v

  # The deployment artefacts are code too: a Dockerfile that stopped
  # building is a broken deploy discovered at deploy time. Builds only —
  # no registry push, because there is no deployment target yet
  # (docs/research/devsecops-deployment.md §2.1 picks Azure Container
  # Apps; nothing is provisioned). Trivy scans what was just built, at
  # the same report-only setting as the upstream images above and for
  # the same reason: base-image CVEs this project cannot fix.
  images:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t ttli-api:ci apps/api

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t ttli-web:ci .

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget gnupg
          wget -qO - https://get.trivy.dev/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://get.trivy.dev/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan built images (report-only)
        run: |
          for img in ttli-api:ci ttli-web:ci; do
            echo "::group::Trivy: $img"
            trivy image --severity CRITICAL,HIGH "$img"
            echo "::endgroup::"
          done

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/api-client/package-lock.json

      # apps/web depends on @ttli/api-client via "file:../../packages/api-client"
      # — npm symlinks the package directory itself, but its own dependencies
      # (openapi-fetch) resolve from *its* node_modules, not apps/web's. That
      # only exists once this install runs.
      - name: Install api-client
        working-directory: packages/api-client
        run: npm ci

      - name: Install web
        run: npm ci

      - name: Dependency scan (web)
        run: npm audit --audit-level=high

      # eslint-config-next/core-web-vitals (flat config), errors blocking;
      # react-hooks/set-state-in-effect is warn-only for the 34 sites that
      # predate the gate — see apps/web/eslint.config.mjs.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # --webpack (already in package.json's build script): Turbopack, Next
      # 16's default, cannot currently resolve @ttli/api-client through the
      # npm-workspace symlink above — a known, still-open upstream limitation
      # (vercel/next.js#85316, #88335, #77562). See apps/web/next.config.ts.
      - name: Build
        run: npm run build

      # Phase 4.5's last open item: the WCAG audit was a one-time computed
      # pass, so a globals.css change could silently reintroduce a contrast
      # or use-of-colour failure. axe-core now runs on every public page on
      # every push (it caught two real link-in-text-block violations the
      # day it was added). No API runs in this job, so the authenticated
      # spec skips itself and the public + axe specs carry the gate.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E and accessibility
        run: npm run test:e2e

  # The fast web job above deliberately has no API and owns the public/axe
  # floor. These four journeys need real auth, RLS, payment, storage and
  # antivirus behaviour, so run them separately against a migrated and
  # deterministically seeded stack. REQUIRE_API_E2E turns their normal
  # bare-checkout skip into a hard failure if this stack ever stops starting.
  authenticated-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ttli
          POSTGRES_PASSWORD: ttli_ci
          POSTGRES_DB: ttli
        ports: ["5452:5432"]
        options: >-
          --health-cmd "pg_isready -U ttli -d ttli"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ["6399:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      clamav:
        image: clamav/clamav-debian:stable
        ports: ["3410:3310"]
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 15

    env:
      ENVIRONMENT: local
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://app_user:app_user_ci@localhost:5452/ttli
      DATABASE_URL_SYNC: postgresql+psycopg2://ttli:ttli_ci@localhost:5452/ttli
      APP_DB_PASSWORD: app_user_ci
      REDIS_URL: redis://localhost:6399/0
      SECRET_KEY: ci-secret-key-at-least-thirty-two-characters
      FIELD_ENCRYPTION_KEY: RkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkY=
      BLIND_INDEX_KEY: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: var/e2e-storage
      CLAMAV_HOST: localhost
      CLAMAV_PORT: "3410"
      REQUIRE_API_E2E: "1"
      # Tenant resolution uses the browser Host header; `localhost` is the
      # seeded demo tenant, while 127.0.0.1 is intentionally not an alias.
      WEB_URL: http://localhost:3011

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/api-client/package-lock.json

      - name: Install API
        run: pip install -r requirements-dev.txt

      - name: Create extensions and migrate
        run: |
          psql -h localhost -p 5452 -U ttli -d ttli -f ../../infra/postgres-init/01-extensions.sql
          alembic upgrade head
        env:
          PGPASSWORD: ttli_ci

      - name: Seed browser accounts
        run: python scripts/seed_e2e_accounts.py

      - name: Start and verify API
        run: |
          nohup python -m uvicorn src.main:app --host 127.0.0.1 --port 8010 > "$RUNNER_TEMP/ttli-api.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8010/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ttli-api.log"
          exit 1

      - name: Install web
        working-directory: .
        run: |
          npm ci --prefix packages/api-client
          npm ci --prefix apps/web

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start and verify web
        working-directory: apps/web
        run: |
          npm run build
          nohup npm run start:e2e > "$RUNNER_TEMP/ttli-web.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3011/robots.txt >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ttli-web.log"
          exit 1

      - name: Authenticated browser journeys
        working-directory: apps/web
        # Together these honest journeys perform 11 logins and would trip
        # the production 10/min/IP policy. Give each spec a fresh limiter
        # window instead of weakening that policy for CI. No session spans
        # spec processes, so clearing Redis here cannot invalidate a journey.
        run: |
          for spec in \
            e2e/learner-assessment.spec.ts \
            e2e/checkout.spec.ts \
            e2e/admin-finance.spec.ts \
            e2e/organisations.spec.ts
          do
            python -c "import redis; redis.Redis.from_url('redis://localhost:6399/0').flushdb()"
            npx playwright test "$spec" --workers=1
          done

      - name: API log on failure
        if: failure()
        working-directory: .
        run: |
          cat "$RUNNER_TEMP/ttli-api.log" || true
          cat "$RUNNER_TEMP/ttli-web.log" || true
