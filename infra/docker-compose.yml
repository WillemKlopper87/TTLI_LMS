# Ports are deliberately non-default. Other projects on this machine already own
# 5432/6379/9000/1025 — see README.md for the full reservation table.
name: ttli

services:
  # Dependency-upgrade sprint E: bumped from postgres:16-alpine. PG18
  # changed the image's own PGDATA default to be version-specific
  # (/var/lib/postgresql/18/docker, confirmed hands-on) and its declared
  # VOLUME to the /var/lib/postgresql parent — so the mount below targets
  # the parent, not a fixed /data path, matching the upstream image's own
  # forward-compatible layout (a future postgres:19 mounting this same
  # volume would create its cluster alongside this one at .../19/docker,
  # not overwrite it). Migrated via dump/restore, not pg_upgrade in-place
  # — a fresh volume (ttli-postgres-18, not a reused ttli-postgres) plus
  # a full pg_dump -Fc/pg_restore round-trip, since the on-disk format
  # isn't binary-compatible across majors and this is a small dev
  # database where a clean restore is simpler and safer than juggling
  # two majors' binaries in one container for `pg_upgrade --link`.
  # citext/pg_trgm/pgcrypto all restored and re-verified against a live
  # PG18 server, not assumed compatible — the one real PG18 behaviour
  # change relevant to pg_trgm (full-text search now honours the
  # cluster's own collation provider instead of always libc) only
  # matters for non-libc providers; this cluster's default `initdb`
  # provider is libc, checked via `SHOW default_text_search_config`/
  # cluster locale, not assumed.
  postgres:
    image: postgres:18-alpine
    container_name: ttli-postgres
    environment:
      POSTGRES_USER: ttli
      POSTGRES_PASSWORD: ttli_local_dev
      POSTGRES_DB: ttli
    ports:
      - "5452:5432"
    volumes:
      - ttli-postgres-18:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttli -d ttli"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Dependency-upgrade sprint F: bumped from redis:7-alpine. Safe on its
  # own, decoupled from the redis-py client (staying pinned <6, see
  # requirements.txt's own comment) — RESP3 is opt-in via HELLO 3, so a
  # RESP2 client is never forced onto it; Redis 8 serves both at once.
  # Also relicensed back to AGPLv3 with the 8.0 GA, so the SSPL/RSAL
  # concern that would once have blocked this doesn't apply anymore.
  redis:
    image: redis:8-alpine
    container_name: ttli-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6399:6379"
    volumes:
      - ttli-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Dependency-upgrade sprint G: replaces minio/minio. Community-edition
  # MinIO's pre-built binaries were discontinued Oct 2025 and the repo
  # itself was archived twice since — no further security patches will
  # ever land on that image. Garage was validated directly against this
  # project's actual services/storage/s3.py usage before adopting it, not
  # assumed compatible: presigned URLs, CopyObject, ListObjectsV2
  # pagination, the Expiration lifecycle action, and S3 CreateBucket
  # itself (needed by ensure_container's runtime bucket creation) all
  # confirmed working end to end against a real container, including the
  # exact BucketAlreadyOwnedByYou idempotency path ensure_container
  # depends on. Object versioning (Garage's one real gap) isn't used here.
  #
  # No env-var root-user bootstrap like MinIO's MINIO_ROOT_USER/PASSWORD
  # — instead `--single-node --default-bucket` (Garage 2.3.0+) reads
  # GARAGE_DEFAULT_ACCESS_KEY/SECRET_KEY/BUCKET and creates the layout,
  # key, and bucket automatically. Confirmed hands-on, not assumed from
  # docs: the auto-created key gets full create-bucket rights (not just
  # owner rights on the one default bucket), so the app's own
  # ensure_container() can still create the other containers it needs.
  # GARAGE_DEFAULT_ACCESS_KEY must match apps/api/.env's S3_ACCESS_KEY —
  # Garage requires the GK<24 hex>/<64 hex> key format, unlike MinIO,
  # which accepted arbitrary strings.
  #
  # No healthcheck: block, unlike every other service here — confirmed
  # hands-on, not assumed, that this is a real gap in the image rather
  # than an oversight in this config. The distroless image ships only
  # the `garage` binary (`docker exec ... sh` fails with "executable
  # file not found in $PATH"), so there is no shell, curl, or wget
  # inside the container to run a CMD-SHELL probe against the admin
  # API's /health endpoint with — the same constraint already
  # documented on mailpit above, for the same reason (no CLI to probe
  # with), just newly hit here rather than previously known.
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: ttli-garage
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GKb9c32ff7b3db35e902fd29f7
      GARAGE_DEFAULT_SECRET_KEY: 43e555c82c4dd74d5d783f61510d2badd718f9937d9e4c326c25628527d5280c
      GARAGE_DEFAULT_BUCKET: ttli-default
    ports:
      # 9140 kept from MinIO's S3 API port for continuity — no change
      # needed to S3_ENDPOINT_URL. 9141 repurposed from MinIO's web
      # console (Garage ships no bundled console) to the admin API,
      # useful for a human to hit /health or /v2/GetClusterHealth
      # directly; see README.md's port table for the same note.
      - "9140:3900"
      - "9141:3903"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ttli-garage-meta:/var/lib/garage/meta
      - ttli-garage-data:/var/lib/garage/data

  # Mailpit — a local SMTP catcher for magic-link/password-reset/guest
  # emails in dev and CI. Not mailhog/mailhog: a Trivy image scan found
  # 109 CRITICAL/1250 HIGH CVEs in that image (years-unmaintained
  # upstream, EOL Alpine 3.12 base — docs/STATUS.md §10 has the full
  # scan). Mailpit is the actively-maintained successor, pinned to a
  # specific tag rather than `:latest`. Its own API is `/api/v1`, not
  # MailHog's `/api/v2` — tests/test_workers.py was written against the
  # real, verified response shape (sent a real message and inspected the
  # actual payload), not assumed MailHog-compatible.
  #
  # v1.29.2 (bumped from v1.24, dependency-upgrade sprint A): fixes
  # CVE-2026-27808, where the Link Check API could be used to probe
  # internal network IPs.
  #
  # v1.31.0 (report M7, Trivy remediation pass): v1.29.2 was six months
  # stale and alone accounted for ~35 of the CVEs that pass found, almost
  # all in its bundled Go toolchain/stdlib -- current as of the bump.
  # Digest-pinned for the same reason as the Dockerfiles' base images.
  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    container_name: ttli-mailpit
    ports:
      - "1145:1025"
      - "8145:8025"

  # Virus scanning before an upload becomes readable (04 §3, REQ-BYPASS-08)
  # — src/services/antivirus.py talks to clamd over this port. First boot
  # downloads the virus database, which can take a few minutes; the long
  # start_period below is deliberate, not a stuck container.
  clamav:
    image: clamav/clamav-debian:stable
    container_name: ttli-clamav
    ports:
      - "3410:3310"
    volumes:
      - ttli-clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 5m

volumes:
  ttli-postgres-18:
  ttli-redis:
  ttli-garage-meta:
  ttli-garage-data:
  ttli-clamav:
