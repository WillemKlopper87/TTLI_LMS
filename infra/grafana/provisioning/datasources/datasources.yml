# Provisioned so the Prometheus datasource exists on first boot without a
# manual click-through — Grafana reads this directory on startup
# (GF_PATHS_PROVISIONING, default /etc/grafana/provisioning).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: ttli-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: ttli-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
