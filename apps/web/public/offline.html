<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f4f2;
        color: #1c1719;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 26rem;
      }
      img {
        width: 64px;
        height: 64px;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        font-size: 0.9375rem;
        color: #6e6469;
        margin: 0;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.6rem 1.2rem;
        border: none;
        border-radius: 3px;
        background: #8e151c;
        color: #fdf8f9;
        font-size: 0.875rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="" />
      <h1>You&rsquo;re offline</h1>
      <p>This page needs a connection. Reconnect and try again — your course progress is saved on the server, not lost.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
