[project]
name = "ttli-api"
version = "0.1.0"
description = "TTLI executive training platform — API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "S", "DTZ", "RUF"]
ignore = [
  "B008",  # FastAPI depends on function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]        # asserts and test credentials
"alembic/versions/*" = ["E501"]              # generated SQL is wide
# Dev-only scripts put sys.path.insert before their src imports so they can
# be run directly from apps/api without installing the package.
"scripts/*" = ["E402"]
# conftest must rewrite DATABASE_URL/REDIS_URL to the isolated test
# database BEFORE src.core.config is imported (get_settings caches), so
# its env-swap helpers necessarily precede the imports.
"tests/conftest.py" = ["E402", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["argon2.*", "boto3.*", "botocore.*", "pywebpush.*", "qrcode.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
# Function-scoped loop: asyncpg connections are bound to the loop that created
# them, and a session-scoped loop leaks connections across tests.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: requires a live Postgres",
  # No marker at module scope IS the fast tier (TTLI_Audit_Report_2026-09-02.md
  # M5) -- this explicit marker exists so `pytest -m unit` can select it
  # deliberately rather than by the absence of the other one, and so a
  # module that's fast today stays fast on purpose, not by accident.
  "unit: pure, no Postgres/Redis -- safe to run with `pytest -m unit`",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# The floor covers only the fast (non-integration) tier -- see the
# "Fast-tier coverage" CI step in ci.yml, which runs
# `pytest -m "not integration" --cov --cov-fail-under=<floor>`. Set once
# from a real measurement (TTLI_Audit_Report_2026-09-02.md M5), not
# invented; raise it as more pure logic gets extracted and covered, never
# lower it without a comment saying why.
skip_covered = false
show_missing = true
