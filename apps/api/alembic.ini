[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Timestamped, zero-padded revision ids so the versions directory sorts the way
# the migrations actually run.
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url is supplied by alembic/env.py from Settings, so the connection
# string never lives in a file that gets committed.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
